name: Release
run-name: ${{ inputs.channel || 'nightly' }} release by @${{ github.actor }}

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [nightly, production]
        default: nightly
        required: true

permissions:
  contents: read

env:
  RELEASE_CHANNEL: ${{ inputs.channel || 'nightly' }}

concurrency:
  group: evita-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      macos_signing: ${{ steps.signing.outputs.macos }}
      package_signing: ${{ steps.signing.outputs.packages }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --cwd .github/release --frozen-lockfile --ignore-scripts
      - run: bun .github/release/check.mjs
      - name: Calculate semantic version and notes
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun .github/release/release.mjs plan
      - name: Detect optional signing credentials
        id: signing
        if: steps.version.outputs.release == 'true'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PACKAGE_SIGNING_FINGERPRINT: ${{ vars.PACKAGE_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ -n "$MACOS_CERTIFICATE_BASE64" && -n "$MACOS_CERTIFICATE_PASSWORD" \
            && -n "$MACOS_SIGNING_IDENTITY" && -n "$APPLE_ID" \
            && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
            echo 'macos=true' >> "$GITHUB_OUTPUT"
          else
            echo 'macos=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Apple signing credentials are incomplete; the macOS package will be unsigned and will not be notarized.'
          fi
          if [[ -n "$PACKAGE_SIGNING_KEY" && -n "$PACKAGE_SIGNING_FINGERPRINT" ]]; then
            echo 'packages=true' >> "$GITHUB_OUTPUT"
          else
            echo 'packages=false' >> "$GITHUB_OUTPUT"
            echo '::notice::GPG package signing credentials are incomplete; signed Linux package repositories will be skipped.'
          fi
      - name: Apply planned version to manifests
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 .github/release/version.py "$VERSION"
      - uses: actions/upload-artifact@v7.0.1
        if: steps.version.outputs.release == 'true'
        with:
          name: release-manifests
          path: |
            Cargo.toml
            Cargo.lock
            fuzz/Cargo.lock
            packaging/macos/Info.plist
            target/release-plan.json
          if-no-files-found: error
          retention-days: 14

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PACKAGE_ROOT: dist
      EVITA_RELEASES_URL: https://api.github.com/repos/tsukumivi/Evita/releases
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-manifests
          path: .
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - name: Offline checks
        run: cargo xtask check
      - name: Windows installer version regression
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: pwsh
        run: python packaging/windows/test_installer.py
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun tests/login-handoff.cjs
      - name: Package app
        run: |
          cargo xtask package
          mkdir release-assets
          echo "ASSET=evita-$TAG-$RUNNER_OS-$RUNNER_ARCH" >> "$GITHUB_ENV"
      - name: Sign, notarize and verify Mac app
        if: runner.os == 'macOS' && needs.prepare.outputs.macos_signing == 'true'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash packaging/macos/sign-release.sh "$PACKAGE_ROOT/Evita.app"
      - name: Archive Mac package
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc "$PACKAGE_ROOT" "release-assets/$ASSET.zip"
      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:PACKAGE_ROOT/*" -DestinationPath "release-assets/$env:ASSET.zip"
          $installer = Get-ChildItem -Path "dist-installer/*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) {
            Copy-Item -LiteralPath $installer.FullName -Destination "release-assets/$env:ASSET-Setup.exe"
          }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/linux-packages.yml
    with:
      release: true
      tag: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, build, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --cwd .github/release --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-manifests
          path: .
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: evita-*
          path: release-assets
          merge-multiple: true
      - name: Checksums
        working-directory: release-assets
        run: sha256sum ./* > SHA256SUMS.txt
      - name: Commit versions and publish semantic release with notes and assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun .github/release/release.mjs publish

  repositories:
    needs: [prepare, build, linux, publish]
    if: needs.prepare.outputs.release == 'true' && needs.prepare.outputs.package_signing == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/package-repositories.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      channel: ${{ inputs.channel || 'nightly' }}
      base_url: https://tsukumivi.github.io/Evita
      deploy: true
    secrets: inherit
